services:
  gamehub:
    build: .
    container_name: pixelplay
    # Production runs a gateway container on :3000 (the Cloudflare Tunnel
    # target) and this app joins the shared `edge` network as `pixelplay`.
    # Create the network once:  docker network create edge
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-please}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - NODE_OPTIONS=--max-old-space-size=1024
      # Public origin. Pinning it keeps canonicals and sitemaps on one hostname
      # even if a request arrives through www or an alias domain.
      - SITE_URL=${SITE_URL:-}
      - CANONICAL_HOST=${CANONICAL_HOST:-}
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    networks:
      - default
      - edge
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

networks:
  edge:
    external: true

