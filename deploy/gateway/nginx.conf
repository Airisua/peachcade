# Single origin for the Cloudflare Tunnel (still points at localhost:3000).
#   /            -> Peachcade games site (pixelplay container)
#   /gcli2api/   -> gcli2api FastAPI service, prefix stripped

# Cloudflare terminates TLS and forwards X-Forwarded-Proto; keep it so the Node
# app still believes the request is https.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# The panel is a private console on the public games domain: keep it out of the
# index and slow down password guessing.
limit_req_zone $binary_remote_addr zone=gcli_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gcli_api:10m rate=30r/s;
limit_req_status 429;

server {
    listen 3000;
    server_name _;
    server_tokens off;

    client_max_body_size 50m;

    # Docker's embedded DNS. Upstreams are resolved per request (through the
    # variables below) instead of once at startup, so:
    #   - recreating the app container no longer leaves nginx pointing at a dead IP;
    #   - a stopped optional service (gcli2api) only breaks its own location
    #     instead of taking the whole gateway down with "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;

    # No trailing slash: relative asset paths in the panel would resolve to /front/...
    location = /gcli2api {
        absolute_redirect off;
        return 301 /gcli2api/;
    }

    location /gcli2api/ {
        set $gcli_upstream gcli2api:7861;
        rewrite ^/gcli2api/(.*)$ /$1 break;
        proxy_pass http://$gcli_upstream;
        proxy_http_version 1.1;

        limit_req zone=gcli_api burst=60 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Prefix /gcli2api;

        # SSE / long-running generations must not be buffered.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # The app answers with root-relative redirects; re-prefix them.
        proxy_redirect ~^https?://[^/]+/(.*)$ /gcli2api/$1;
        proxy_redirect ~^/(.*)$ /gcli2api/$1;
    }

    location = /gcli2api/auth/login {
        limit_req zone=gcli_login burst=5 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;

        set $gcli_upstream gcli2api:7861;
        proxy_pass http://$gcli_upstream/auth/login;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location / {
        set $app_upstream pixelplay:3000;
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        proxy_read_timeout 120s;
    }
}
