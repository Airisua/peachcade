<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f0f1a;color:#e8e8f2;font-family:Arial,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none}
#game-root{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.score{background:#1b1b2c;border:1px solid #2a2a3e;padding:7px 16px;border-radius:10px;text-align:center;min-width:80px}
.score small{display:block;color:#9a9ab2;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.score b{font-size:19px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(76vw,360px);aspect-ratio:1/1}
.cell{background:#232338;border:1px solid #2a2a3e;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(30px,10vw,58px);font-weight:900;cursor:pointer;transition:.12s}
.cell:hover{border-color:#8b5cf6}
.cell.x{color:#22d3ee}
.cell.o{color:#f472b6}
.cell.win{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.6)}
button{background:linear-gradient(135deg,#8b5cf6,#ec4899);border:0;color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.hint{color:#9a9ab2;font-size:12.5px}
#status{font-size:16px;font-weight:700;min-height:22px}
</style>
</head>
<body>
<div id="game-root">
  <div class="top">
    <div class="score"><small>X (You)</small><b id="sx">0</b></div>
    <div class="score"><small>Draws</small><b id="sd">0</b></div>
    <div class="score"><small>O (AI)</small><b id="so">0</b></div>
  </div>
  <div id="status">You are X. Your turn.</div>
  <div class="grid" id="grid"></div>
  <div class="hint">Beat the AI - it is clever but beatable</div>
  <button id="restart">New Round</button>
</div>
<script>
(function () {
  var grid = document.getElementById('grid');
  var statusEl = document.getElementById('status');
  var sxEl = document.getElementById('sx');
  var soEl = document.getElementById('so');
  var sdEl = document.getElementById('sd');
  var board, over, turn, wins = { x: 0, o: 0, d: 0 }, starter = 'x';
  var cells = [];
  for (var i = 0; i < 9; i++) {
    var b = document.createElement('div');
    b.className = 'cell';
    b.dataset.i = String(i);
    b.addEventListener('click', onCell);
    grid.appendChild(b);
    cells.push(b);
  }
  function newRound() {
    board = ['', '', '', '', '', '', '', '', ''];
    over = false;
    turn = starter;
    cells.forEach(function (c) { c.textContent = ''; c.className = 'cell'; });
    statusEl.textContent = turn === 'x' ? 'You are X. Your turn.' : 'AI starts...';
    if (turn === 'o') setTimeout(aiMove, 450);
  }
  function onCell(e) {
    if (over || turn !== 'x') return;
    var i = parseInt(e.currentTarget.dataset.i, 10);
    if (board[i]) return;
    play(i, 'x');
  }
  function play(i, mark) {
    board[i] = mark;
    var c = cells[i];
    c.textContent = mark.toUpperCase();
    c.classList.add(mark);
    var w = winner(board);
    if (w) { finish(w); return; }
    if (board.every(function (v) { return v; })) { finish('d'); return; }
    turn = mark === 'x' ? 'o' : 'x';
    if (turn === 'o') { statusEl.textContent = 'AI thinking...'; setTimeout(aiMove, 420); }
    else statusEl.textContent = 'Your turn.';
  }
  function finish(w) {
    over = true;
    if (w === 'd') {
      wins.d++;
      sdEl.textContent = String(wins.d);
      statusEl.textContent = 'Draw!';
    } else if (w === 'x') {
      wins.x++;
      sxEl.textContent = String(wins.x);
      statusEl.textContent = 'You win!';
    } else {
      wins.o++;
      soEl.textContent = String(wins.o);
      statusEl.textContent = 'AI wins. Try again!';
    }
    var line = winLine(board);
    if (line) line.forEach(function (i) { cells[i].classList.add('win'); });
    starter = starter === 'x' ? 'o' : 'x';
    setTimeout(function () {
      if (!over) return;
      statusEl.textContent += ' New round starts in 1.2s.';
      setTimeout(newRound, 1200);
    }, 500);
  }
  function winner(b) {
    var L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (var i = 0; i < L.length; i++) {
      var l = L[i];
      if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return b[l[0]];
    }
    return '';
  }
  function winLine(b) {
    var L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (var i = 0; i < L.length; i++) {
      var l = L[i];
      if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return l;
    }
    return null;
  }
  function aiMove() {
    if (over || turn !== 'o') return;
    var empties = [];
    for (var i = 0; i < 9; i++) if (!board[i]) empties.push(i);
    if (!empties.length) return;
    var move;
    if (Math.random() < 0.2) {
      move = empties[Math.floor(Math.random() * empties.length)];
    } else {
      var bestScore = -2, bestMove = empties[0];
      for (var j = 0; j < empties.length; j++) {
        board[empties[j]] = 'o';
        var s = minimax(board, false, 0);
        board[empties[j]] = '';
        if (s > bestScore) { bestScore = s; bestMove = empties[j]; }
      }
      move = bestMove;
    }
    play(move, 'o');
  }
  function minimax(b, isMax, depth) {
    var w = winner(b);
    if (w === 'o') return 10 - depth;
    if (w === 'x') return depth - 10;
    if (b.every(function (v) { return v; })) return 0;
    var empties = [];
    for (var i = 0; i < 9; i++) if (!b[i]) empties.push(i);
    if (isMax) {
      var best = -100;
      for (var j = 0; j < empties.length; j++) {
        b[empties[j]] = 'o';
        best = Math.max(best, minimax(b, false, depth + 1));
        b[empties[j]] = '';
      }
      return best;
    }
    var worst = 100;
    for (var k = 0; k < empties.length; k++) {
      b[empties[k]] = 'x';
      worst = Math.min(worst, minimax(b, true, depth + 1));
      b[empties[k]] = '';
    }
    return worst;
  }
  document.getElementById('restart').addEventListener('click', newRound);
  newRound();
})();
</script>
</body>
</html>
