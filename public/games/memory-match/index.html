<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f0f1a;color:#e8e8f2;font-family:Arial,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none}
#game-root{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;position:relative}
.top{display:flex;gap:14px;align-items:center}
.score{background:#1b1b2c;border:1px solid #2a2a3e;padding:7px 16px;border-radius:10px;text-align:center;min-width:86px}
.score small{display:block;color:#9a9ab2;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.score b{font-size:19px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(84vw,400px);aspect-ratio:1/1}
.card{background:#232338;border:1px solid #2a2a3e;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,7vw,40px);cursor:pointer;transition:.15s}
.card:hover{border-color:#8b5cf6}
.card.flip{background:#312e5e;border-color:#8b5cf6}
.card.done{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.5);cursor:default}
.overlay{position:absolute;inset:0;background:rgba(10,10,18,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px}
.overlay.show{display:flex}
.overlay h2{margin:0;font-size:26px}
button{background:linear-gradient(135deg,#8b5cf6,#ec4899);border:0;color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.hint{color:#9a9ab2;font-size:12.5px}
</style>
</head>
<body>
<div id="game-root">
  <div class="top">
    <div class="score"><small>Moves</small><b id="moves">0</b></div>
    <div class="score"><small>Pairs</small><b id="pairs">0/8</b></div>
    <div class="score"><small>Best</small><b id="best">-</b></div>
    <button id="restart">Restart</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="hint">Flip cards and match all 8 pairs</div>
  <div class="overlay" id="overlay"><h2>You Win!</h2><div id="ovsub" class="hint"></div><button id="ovbtn">Play again</button></div>
</div>
<script>
(function () {
  var EMOJI = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
  var grid = document.getElementById('grid');
  var movesEl = document.getElementById('moves');
  var pairsEl = document.getElementById('pairs');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovsub = document.getElementById('ovsub');
  var best = 0;
  try { best = parseInt(localStorage.getItem('pixelplay.best.memory-match') || '0', 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best ? String(best) : '-';
  var deck = [], first = null, lock = false, moves = 0, found = 0;
  function build() {
    deck = EMOJI.concat(EMOJI);
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    grid.innerHTML = '';
    first = null; lock = false; moves = 0; found = 0;
    movesEl.textContent = '0';
    pairsEl.textContent = '0/8';
    overlay.classList.remove('show');
    deck.forEach(function (em, idx) {
      var c = document.createElement('div');
      c.className = 'card';
      c.dataset.v = em;
      c.dataset.idx = String(idx);
      c.addEventListener('click', function () { flip(c); });
      grid.appendChild(c);
    });
  }
  function flip(c) {
    if (lock || c.classList.contains('flip') || c.classList.contains('done')) return;
    c.classList.add('flip');
    c.textContent = c.dataset.v;
    if (!first) { first = c; return; }
    moves++;
    movesEl.textContent = String(moves);
    if (first.dataset.v === c.dataset.v) {
      first.classList.add('done');
      c.classList.add('done');
      first = null;
      found++;
      pairsEl.textContent = found + '/8';
      if (found === 8) win();
    } else {
      lock = true;
      var f = first;
      first = null;
      setTimeout(function () {
        f.classList.remove('flip');
        c.classList.remove('flip');
        f.textContent = '';
        c.textContent = '';
        lock = false;
      }, 700);
    }
  }
  function win() {
    if (!best || moves < best) {
      best = moves;
      bestEl.textContent = String(best);
      try { localStorage.setItem('pixelplay.best.memory-match', String(best)); } catch (e) {}
    }
    ovsub.textContent = 'Finished in ' + moves + ' moves.';
    overlay.classList.add('show');
  }
  document.getElementById('restart').addEventListener('click', build);
  document.getElementById('ovbtn').addEventListener('click', build);
  build();
})();
</script>
</body>
</html>
