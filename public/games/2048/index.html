<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f0f1a;color:#e8e8f2;font-family:Arial,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#game-root{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
.top{display:flex;gap:14px;align-items:center}
.score{background:#1b1b2c;border:1px solid #2a2a3e;padding:7px 16px;border-radius:10px;text-align:center;min-width:86px}
.score small{display:block;color:#9a9ab2;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.score b{font-size:19px}
button{background:linear-gradient(135deg,#8b5cf6,#ec4899);border:0;color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;background:#1b1b2c;border:1px solid #2a2a3e;border-radius:14px;padding:10px;width:min(80vw,400px);max-width:min(80vw,400px);aspect-ratio:1/1}
.cell{background:#232338;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(15px,5vw,30px);transition:background .12s}
.overlay{position:absolute;inset:0;background:rgba(10,10,18,.85);border-radius:14px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:26px;font-weight:800;text-align:center;padding:16px}
.overlay.show{display:flex}
.hint{color:#9a9ab2;font-size:12.5px}
</style>
</head>
<body>
<div id="game-root">
  <div class="top">
    <div class="score"><small>Score</small><b id="score">0</b></div>
    <div class="score"><small>Best</small><b id="best">0</b></div>
    <button id="restart">Restart</button>
  </div>
  <div class="board" id="board">
    <div class="overlay" id="overlay"><div id="ovmsg">Game Over</div><button id="ovbtn">Restart</button></div>
  </div>
  <div class="hint">Arrow keys / WASD / swipe to move</div>
</div>
<script>
(function () {
  var board = [], score = 0, best = 0, won = false, over = false, mode = 'over';
  var boardEl = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovmsg = document.getElementById('ovmsg');
  var ovbtn = document.getElementById('ovbtn');
  try { best = parseInt(localStorage.getItem('pixelplay.best.2048') || '0', 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;
  var cells = [];
  for (var i = 0; i < 16; i++) {
    var d = document.createElement('div');
    d.className = 'cell';
    boardEl.appendChild(d);
    cells.push(d);
  }
  var COLORS = { 2: ['#2b2b44', '#dcdcf0'], 4: ['#34345a', '#e6e6f5'], 8: ['#6d28d9', '#fff'], 16: ['#7c3aed', '#fff'], 32: ['#8b5cf6', '#fff'], 64: ['#a855f7', '#fff'], 128: ['#c026d3', '#fff'], 256: ['#db2777', '#fff'], 512: ['#e11d48', '#fff'], 1024: ['#f59e0b', '#1b1b2c'], 2048: ['#facc15', '#1b1b2c'] };
  function render() {
    for (var i = 0; i < 16; i++) {
      var v = board[i];
      var c = cells[i];
      c.textContent = v ? String(v) : '';
      var col = v ? (COLORS[v] || ['#fde047', '#1b1b2c']) : ['#232338', '#fff'];
      c.style.background = col[0];
      c.style.color = col[1];
    }
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('pixelplay.best.2048', String(best)); } catch (e) {} }
  }
  function empty() { var out = []; for (var i = 0; i < 16; i++) if (!board[i]) out.push(i); return out; }
  function addRandom() {
    var e = empty();
    if (!e.length) return;
    board[e[Math.floor(Math.random() * e.length)]] = Math.random() < 0.9 ? 2 : 4;
  }
  function slide(row) {
    var arr = row.filter(function (x) { return x; });
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      if (arr[i] === arr[i + 1]) {
        out.push(arr[i] * 2);
        score += arr[i] * 2;
        if (arr[i] * 2 === 2048 && !won) { won = true; showOverlay('You Win!', 'win'); }
        i++;
      } else out.push(arr[i]);
    }
    while (out.length < 4) out.push(0);
    return out;
  }
  function canMove() {
    for (var i = 0; i < 16; i++) if (!board[i]) return true;
    for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++) {
      var v = board[r * 4 + c];
      if (c < 3 && v === board[r * 4 + c + 1]) return true;
      if (r < 3 && v === board[(r + 1) * 4 + c]) return true;
    }
    return false;
  }
  function showOverlay(msg, m) { ovmsg.textContent = msg; mode = m; overlay.classList.add('show'); }
  function move(dir) {
    if (over) return;
    var before = board.join(',');
    var i, j;
    if (dir === 'left' || dir === 'right') {
      for (i = 0; i < 4; i++) {
        var row = [];
        for (j = 0; j < 4; j++) row.push(board[i * 4 + j]);
        if (dir === 'right') row.reverse();
        row = slide(row);
        if (dir === 'right') row.reverse();
        for (j = 0; j < 4; j++) board[i * 4 + j] = row[j];
      }
    } else {
      for (j = 0; j < 4; j++) {
        var col = [];
        for (i = 0; i < 4; i++) col.push(board[i * 4 + j]);
        if (dir === 'down') col.reverse();
        col = slide(col);
        if (dir === 'down') col.reverse();
        for (i = 0; i < 4; i++) board[i * 4 + j] = col[i];
      }
    }
    if (board.join(',') !== before) {
      addRandom();
      render();
      if (!canMove()) { over = true; showOverlay('Game Over', 'over'); }
    }
  }
  function reset() {
    board = []; score = 0; won = false; over = false;
    for (var i = 0; i < 16; i++) board.push(0);
    addRandom(); addRandom();
    overlay.classList.remove('show');
    render();
  }
  ovbtn.addEventListener('click', function () {
    if (mode === 'win') { overlay.classList.remove('show'); return; }
    reset();
  });
  document.getElementById('restart').addEventListener('click', reset);
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    var map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down' };
    if (map[k]) { e.preventDefault(); move(map[k]); }
  });
  var sx = 0, sy = 0;
  boardEl.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  boardEl.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }, { passive: true });
  reset();
})();
</script>
</body>
</html>
